[project]
name = "ricemap"
version = "0.1.0"
description = "Bangladesh seasonal rice mapping pipeline using Sentinel-1 time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "planetary-computer",
    "pyproj",
    "pystac-client",
    "rasterio",
    "requests",
    "scikit-learn",
    "scipy",
    "shapely",
    "torch",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ricemap*"]
